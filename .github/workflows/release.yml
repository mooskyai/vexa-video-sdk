name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages to npm
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    environment: npm-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Match tag to package version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Verify repository
        run: npm run verify

      - name: Validate release metadata
        run: npm run release:check

      - name: Dry-run package contents
        run: npm run release:pack

      - name: Publish with npm provenance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          VEXA_RELEASE_CONFIRM: PUBLISH
        run: npm run release:publish

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Vexa Video SDK $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
