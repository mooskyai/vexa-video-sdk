name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages to npm
        type: boolean
        required: true
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release-acceptance:
    uses: ./.github/workflows/release-acceptance.yml

  verify-and-release:
    needs: release-acceptance
    runs-on: ubuntu-24.04
    environment: npm-release
    env:
      VEXA_RELEASE_ENVIRONMENT: npm-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Match tag to package version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Require a version tag for npm publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: test "$GITHUB_REF_TYPE" = "tag"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify trusted publishing environment
        env:
          VEXA_TRUSTED_PUBLISH_RUNTIME: "1"
        run: npm run release:trusted-publish-check

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg baseline
        run: npm run release:ffmpeg-check

      - name: Install dependencies
        run: npm ci

      - name: Format policy
        run: npm run format:check

      - name: Verify repository
        run: npm run verify

      - name: Validate release metadata
        run: npm run release:check

      - name: Dry-run package contents
        run: npm run release:pack

      - name: Verify clean packed-package install
        run: npm run release:install-check

      - name: Publish with npm provenance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          VEXA_RELEASE_CONFIRM: PUBLISH
        run: npm run release:publish

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Vexa Video SDK $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Vexa Video SDK $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          fi
